services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: seirama
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - onlytesting_clickhouse_data:/var/lib/clickhouse

volumes:
  onlytesting_clickhouse_data:
    external: true
    name: onlytesting_clickhouse_data
